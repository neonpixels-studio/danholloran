[build]
  command = "npm run test:ci && npm run build"
  publish = ".vitepress/dist"
  ignore = "bash netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "24"

[context.production]
  # Overrides the build-level netlify-ignore.sh for production only, so deploy
  # previews keep its draft/variant skips. Netlify cancels the build when this
  # exits 0 and builds when it exits 1. Production deploys only via the build
  # hook (daily workflow or manual dispatch).
  ignore = "if [ -n \"$INCOMING_HOOK_TITLE\" ]; then exit 1; else exit 0; fi"
