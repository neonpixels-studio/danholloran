name: External Link Rot

# Scheduled only: checking ~500 third-party URLs is slow and flaky by nature, so
# it must never gate a PR or a deploy. Dead links land in one tracking issue.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: external-link-rot
  cancel-in-progress: false

jobs:
  check-external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # The script only uses Node built-ins, so no `npm ci` is needed.
      - name: Check outbound links
        run: node scripts/check-external-links.mjs

      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create link-rot --force \
            --color FBCA04 \
            --description "Dead external links found by the weekly check"
          existing_issue="$(gh issue list --state open --label link-rot --limit 1 --json number --jq '.[0].number')"
          has_dead_links=false
          grep -q '^### ' link-rot-report.md && has_dead_links=true
          if [ "$has_dead_links" = false ] && [ -n "$existing_issue" ]; then
            gh issue close "$existing_issue" --comment "No dead external links found in $RUN_URL. Closing."
          fi
          if [ "$has_dead_links" = false ]; then
            exit 0
          fi
          body="$(printf 'Dead external links (404, 410 or DNS failure) found in posts. Run: %s\n\n%s' "$RUN_URL" "$(cat link-rot-report.md)")"
          if [ -n "$existing_issue" ]; then
            gh issue edit "$existing_issue" --body "$body"
            exit 0
          fi
          gh issue create --label link-rot --title "Dead external links in posts" --body "$body"
