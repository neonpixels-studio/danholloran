name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, dev]
  # Dispatched by image-variants.yml after it pushes a commit (see there).
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Exclude draft posts from Prettier
        run: |
          grep -rl "^draft: true" .vitepress/content/posts/ 2>/dev/null \
            >> .prettierignore || true

      - name: Lint
        run: |
          npx prettier --check .
          npx eslint .
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            npx fallow audit --base "$BASE"
          else
            npx fallow audit
          fi

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci
