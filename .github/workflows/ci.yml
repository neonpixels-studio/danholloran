name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Exclude draft posts from Prettier
        run: |
          grep -rl "^draft: true" .vitepress/content/posts/ 2>/dev/null \
            >> .prettierignore || true

      - name: Lint
        run: |
          npx prettier --check .
          npx eslint .
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            npx fallow audit --base "$BASE"
          else
            npx fallow audit
          fi

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci
