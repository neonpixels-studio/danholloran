name: Lighthouse

# Called from ci.yml after the ci job, so it runs on the same events as CI and
# consumes that job's build artifact instead of rebuilding.
on:
  workflow_call:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-build
          path: .vitepress/dist

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
