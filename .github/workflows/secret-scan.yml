name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Checksum-verified binary download instead of a third-party action.
      - name: Download and verify gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o gitleaks.checksums
          grep " ${archive}\$" gitleaks.checksums | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks

      - name: Scan pull request commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --config .gitleaks.toml --no-banner --redact --log-opts "${BASE_SHA}..${HEAD_SHA}"

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: ./gitleaks git --config .gitleaks.toml --no-banner --redact
