version: 2
# Do not set target-branch on any entry. Security updates always target the
# default branch, and when target-branch is set this file's groups, labels, and
# assignees stop applying to them (see neonpixels-studio/farflung#479).
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "grimicorn"
    # @todo Remove once @typescript-eslint/parser's typescript peer range allows 7.x.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    # A dependency joins the first group it matches, so the coupled toolchain
    # families come before the minor/patch catch-all. Coupled families have no
    # update-types filter so their major bumps land together in one PR.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      vue:
        patterns:
          - "vue"
          - "vue-tsc"
          - "@vue/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "grimicorn"
    groups:
      # Keep the SHA-pinned workflow actions current in a single PR. Majors
      # arrive as their own PRs.
      actions:
        update-types:
          - "minor"
          - "patch"
